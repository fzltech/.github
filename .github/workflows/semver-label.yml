name: Semantic Version Label

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  check-label:
    name: check-label
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one semantic version label
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = [
              'Semantic Versioning: Patch',
              'Semantic Versioning: Minor',
              'Semantic Versioning: Major',
            ];
            const names = context.payload.pull_request.labels.map(l => l.name);
            const semver = names.filter(n => n.startsWith('Semantic Versioning:'));
            const invalid = semver.filter(n => !allowed.includes(n));
            if (invalid.length) {
              core.setFailed(`Unknown semantic version label(s): ${invalid.join(', ')}`);
              return;
            }
            if (semver.length !== 1) {
              core.setFailed(`Expected exactly one of ${allowed.join(', ')}; found ${semver.length}.`);
              return;
            }
            core.info(`Using ${semver[0]}`);
